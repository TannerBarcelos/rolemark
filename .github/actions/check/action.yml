name: Install and check
description: Install dependencies, lint, format-check, build, and typecheck.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.11

    - shell: bash
      run: bun install --frozen-lockfile

    - shell: bash
      run: bun run lint

    - shell: bash
      run: bun run fmt:check

    # Build before typecheck: the build generates src/routeTree.gen.ts. Build
    # identity comes from APP_BUILD_ID / APP_BUILD_SEQ in the caller's env.
    - shell: bash
      run: bun --bun run build

    - shell: bash
      run: bun run typecheck
