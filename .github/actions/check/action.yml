name: Install and check
description: Install dependencies, lint, format-check, test, check migrations, build, and typecheck.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.11

    - shell: bash
      run: bun install --frozen-lockfile

    - shell: bash
      run: bun run lint

    - shell: bash
      run: bun run fmt:check

    # Unit, DOM, and Workers-runtime tests (vitest.config.ts, docs/testing.md).
    - shell: bash
      run: bun run test

    # CD applies drizzle/ as-is, so a schema.ts change without its migration would
    # deploy code that expects columns the database never gets.
    - name: Check migrations match the schema
      shell: bash
      run: |
        bun run db:generate
        if [ -n "$(git status --porcelain -- drizzle)" ]; then
          git status --porcelain -- drizzle
          echo "::error::src/db/schema.ts has changes without a migration. Run 'bun run db:generate' and commit drizzle/."
          exit 1
        fi

    # Build before typecheck: the build generates src/routeTree.gen.ts. Build
    # identity comes from APP_BUILD_ID / APP_BUILD_SEQ in the caller's env.
    - shell: bash
      run: bun --bun run build

    - shell: bash
      run: bun run typecheck
