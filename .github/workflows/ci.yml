name: CI

# Verifies pull requests into develop (features) and main (releases). Builds
# here are never deployed; see cd.yml.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/check

  # Production only receives releases: PRs into main must come from this
  # repo's develop branch. Make this a required check on main.
  release-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require develop as the source of PRs into main
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "Base is $BASE_REF; no release-source rule applies."
            exit 0
          fi
          if [ "$HEAD_REF" = "develop" ] && [ "$HEAD_REPO" = "$REPO" ]; then
            echo "Release PR from $REPO:develop."
            exit 0
          fi
          echo "::error::PRs into main must come from $REPO:develop (got $HEAD_REPO:$HEAD_REF). Target develop instead."
          exit 1
