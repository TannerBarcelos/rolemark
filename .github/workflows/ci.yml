name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run fmt:check

      # Pin the build identity once so the client and server bundles (and any
      # instance deployed from this artifact) all report the same build. The
      # client uses APP_BUILD_SEQ to decide whether the server is newer.
      # run_number is per workflow file: renaming or recreating this file
      # resets it to 1, which would make every new build look older.
      - name: Set build identity
        run: |
          echo "APP_BUILD_ID=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "APP_BUILD_SEQ=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # Build before typecheck: the build generates src/routeTree.gen.ts.
      - run: bun --bun run build

      - run: bun run typecheck

      # Deploy from this artifact rather than rebuilding per environment, or
      # each rebuild gets a new build identity.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
